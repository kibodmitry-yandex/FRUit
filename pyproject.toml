[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fruit"
version = "0.2.2"
description = "FRUit — Folder Restore Utility: сохранение и восстановление окон и вкладок Проводника Windows 11"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "FRUit contributors" }]
keywords = ["explorer", "windows", "tabs", "restore", "shell"]
classifiers = [
    "Environment :: Win32 (MS Windows)",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Topic :: Desktop Environment :: File Managers",
]

dependencies = [
    "comtypes>=1.4.11",
    "pystray>=0.19",
    "Pillow>=10.0",
    "pynput>=1.7",
]

[project.scripts]
fruit = "fruit.cli:main"
fruit-tray = "fruit.tray:run"

[project.urls]
Homepage = "https://github.com/FRUit/fruit"

[tool.setuptools.packages.find]
include = ["fruit*"]
